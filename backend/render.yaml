services:
  - type: web
    name: page-pulse-backend
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "5000"
      - key: CORS_ORIGIN
        value: "https://your-frontend-url.vercel.app"
    secretEnvVars:
      - key: JWT_SECRET
